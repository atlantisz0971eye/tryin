<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>tryin'</title>
  <meta name="description" content="Turn any photo or short video into a frozen moment you can walk into. Everything stays on your device." />
  <meta name="theme-color" content="#1b1a18" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect x='1' y='1' width='14' height='14' fill='%231b1a18'/><rect x='3' y='3' width='10' height='8' fill='%23d8d2c6'/></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Long+Cang&family=Noto+Serif+SC:wght@300;400&display=swap" />
  <link rel="stylesheet" href="src/style.css" />
  <script type="importmap">
    { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js" } }
  </script>
</head>
<body>
  <main class="desk">
    <div class="card" id="card">
      <!-- front of the print: the moment itself -->
      <section class="face front" aria-hidden="false">
        <div class="photo" id="photo">
          <canvas id="stage"></canvas>

          <section id="intro" class="overlay">
            <div class="intro-inner">
              <h1>tryin'</h1>
              <p class="lede" data-i18n="intro.lede"></p>
              <label id="drop" class="drop">
                <input id="file" type="file" accept="image/*,video/*" hidden />
                <span class="drop-title" data-i18n="drop.title"></span>
              </label>
              <p class="fine" data-i18n="intro.fine"></p>
            </div>
          </section>

          <section id="busy" class="overlay hidden" aria-live="polite">
            <div class="busy-inner">
              <div class="pulse"></div>
              <p id="busy-text" data-i18n="busy.ready"></p>
              <div class="bar"><div id="busy-bar"></div></div>
            </div>
          </section>

          <div id="edge-warn" aria-live="polite"><span data-i18n="edge.warn"></span></div>

          <section id="walk-prompt" class="hidden" aria-live="polite">
            <div class="walk-card">
              <p class="walk-title" data-i18n="walk.title"></p>
              <p class="walk-sub" data-i18n="walk.sub"></p>
              <div class="walk-actions">
                <button id="btn-walk-stay" class="label" type="button" data-i18n="walk.stay"></button>
                <button id="btn-walk-go" class="label" type="button" data-i18n="walk.go"></button>
              </div>
            </div>
          </section>

          <div id="hud" class="hidden">
            <div class="hud-bottom" id="hud-drawer" aria-hidden="true">
              <div class="hud-line">
                <span id="dist"></span>
                <span id="tstat" class="hidden"></span>
              </div>
              <span class="hint" id="hint"></span>
            </div>
          </div>
        </div>

        <!-- hand-drawn arrows from the picture down to the two corner labels -->
        <div id="guide" class="on" aria-hidden="true">
          <div class="guide-item guide-home">
            <span class="guide-note" data-i18n-html="guide.home"></span>
            <svg viewBox="0 0 64 84" focusable="false">
              <path pathLength="1" d="M44 3C40 17 20 24 23 43C25 56 17 65 15 77" />
              <path pathLength="1" d="M15 77C11 70 8 65 5 60M15 77C21 72 26 68 31 66" />
            </svg>
          </div>
          <div class="guide-item guide-menu">
            <span class="guide-note" data-i18n-html="guide.menu"></span>
            <svg viewBox="0 0 64 84" focusable="false">
              <path pathLength="1" d="M18 3C23 18 44 24 40 43C38 56 47 66 49 78" />
              <path pathLength="1" d="M49 78C53 71 56 66 60 61M49 78C43 73 38 69 33 67" />
            </svg>
          </div>
        </div>

        <button id="hud-handle" class="hidden" type="button" aria-expanded="false" aria-controls="hud-drawer" data-i18n-aria="hud.show"></button>
        <div id="stick" class="hidden" role="application" aria-label="Move">
          <canvas id="diagram" class="hidden" data-i18n-aria="diagram.aria"></canvas>
          <span id="stick-ring"></span>
          <span id="stick-knob"></span>
        </div>
        <footer class="margin">
          <button id="btn-home" class="label" type="button" data-i18n="label.home"></button>
          <button id="btn-menu" class="label" type="button" data-i18n-aria="label.menuAria">tryin'</button>
        </footer>
        <p class="credit" data-i18n="credit"></p>
      </section>

      <!-- back of the print: settings, written on the paper -->
      <section class="face back" aria-hidden="true">
        <div class="photo paper">
          <div class="back-inner">
            <header class="back-head">
              <span class="back-title">tryin'</span>
              <span class="back-actions">
                <button id="btn-lang" class="hand-btn" type="button" data-i18n="btn.lang" data-i18n-aria="btn.langAria"></button>
                <button id="btn-new" class="ink-btn" type="button" data-i18n="btn.new"></button>
              </span>
            </header>
            <aside id="panel"></aside>
          </div>
        </div>

        <footer class="margin">
          <button id="btn-flip-back" class="label" type="button" data-i18n="label.flipBack"></button>
          <button id="btn-menu-back" class="label mirrored" type="button" data-i18n-aria="label.backAria">tryin'</button>
        </footer>
        <p class="credit" data-i18n="credit"></p>
      </section>
    </div>
  </main>

  <script type="module" src="src/main.js"></script>
</body>
</html>
