<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Atom · 凝固的一瞬</title>
  <meta name="description" content="上传任意一张照片，把那一瞬间凝固成可以走进去的粒子空间。照片只在你的设备上处理。" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><circle cx='8' cy='8' r='3' fill='%23d8d2c6'/></svg>" />
  <link rel="stylesheet" href="src/style.css" />
  <script type="importmap">
    { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js" } }
  </script>
</head>
<body>
  <canvas id="stage"></canvas>

  <section id="intro" class="overlay">
    <div class="intro-inner">
      <h1>Atom</h1>
      <p class="lede">把一瞬间凝固下来，然后走进去。<br />如果是一段视频，你走动，时间就跟着走。</p>
      <label id="drop" class="drop">
        <input id="file" type="file" accept="image/*,video/*" hidden />
        <span class="drop-title">选择或拖入一张照片或一段短视频</span>
        <span class="drop-sub">JPG / PNG / MP4。视频取前 10 秒，镜头尽量别动</span>
      </label>
      <p class="fine">照片只在你的设备上处理，不会上传到任何地方。首次使用需要下载约 20–50 MB 的深度模型，之后会缓存。</p>
    </div>
  </section>

  <section id="busy" class="overlay hidden" aria-live="polite">
    <div class="busy-inner">
      <div class="pulse"></div>
      <p id="busy-text">准备中</p>
      <div class="bar"><div id="busy-bar"></div></div>
    </div>
  </section>

  <div id="hud" class="hidden">
    <div class="hud-top">
      <button id="btn-new" type="button">换一张</button>
      <button id="btn-home" type="button">回到原点</button>
      <button id="btn-panel" type="button" aria-expanded="false">参数</button>
    </div>
    <div class="hud-bottom">
      <span id="dist">站在拍摄点</span>
      <span id="tstat" class="hidden"></span>
      <span class="hint" id="hint">拖动看四周 · WASD / 滚轮 移动 · Q E 升降 · 双指缩放前进</span>
    </div>
    <canvas id="diagram" class="hidden" width="160" height="160" aria-label="闵可夫斯基时空图"></canvas>
    <aside id="panel" class="hidden"></aside>
  </div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
